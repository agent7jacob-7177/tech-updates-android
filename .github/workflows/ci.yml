name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PACKAGES=()
          [ -d "$ANDROID_HOME/platforms/android-37.1" ] || PACKAGES+=("platforms;android-37.1")
          [ -d "$ANDROID_HOME/build-tools/37.0.0" ] || PACKAGES+=("build-tools;37.0.0")
          if [ ${#PACKAGES[@]} -gt 0 ]; then
            echo "Installing: ${PACKAGES[*]}"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "${PACKAGES[@]}"
          else
            echo "Required SDK packages already installed."
          fi

      - name: Build, lint and test
        run: ./gradlew assembleDebug lintDebug ktlintCheck detekt testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

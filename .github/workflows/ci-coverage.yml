name: CI - Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with Kover coverage and verify
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug koverVerifyDebug --stacktrace

      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-html-report
          path: app/build/reports/kover/htmlDebug
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Kover XML report for CI validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-xml-report
          path: app/build/reports/kover/reportDebug.xml
          retention-days: 14
          if-no-files-found: warn

name: CI - Tests & Coverage

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with Kover coverage
        run: ./gradlew koverHtmlReportDebug

      - name: Upload Kover HTML report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: app/build/reports/kover/htmlDebug
          retention-days: 30

      - name: Upload Kover XML report for CI validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml
          path: app/build/reports/kover/reportDebug.xml
          retention-days: 30

name: CI - Emulator Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/emulator.yml'

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [ 26, 30, 35 ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node:kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger /dev/kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          target: google_apis
          avd-name: tu_api${{ matrix.api-level }}
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim"
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 30
